services:
  mysql:
    image: mysql:8.0
    container_name: blog_vca_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: blog_vca
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: blog_vca_api
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?required}
      JWT_SECRET: ${JWT_SECRET_DOCKER:?required}
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./files:/app/files
    networks:
      - web

volumes:
  mysql_data:

networks:
  web:
    external: true
